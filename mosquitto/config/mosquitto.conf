# QuickPass Mosquitto 설정
# 개발과 운영 모두 Mosquitto가 TLS 연결을 직접 처리한다.
# 인증서와 자격증명 파일은 저장소에 넣지 않고 환경별로 주입한다.

# TLS MQTT 전용 리스너
# Mqtt 포트 지정 및 tls 사용
listener 8883
protocol mqtt

# 서버 인증 키 및 개인 키 정보 및 TLS 버전 지정(1.2 이상)
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2

# 익명 접속 차단 및 사용자별 인증/인가
allow_anonymous false
password_file /mosquitto/config/auth/password.txt
acl_file /mosquitto/config/acl.txt

# 메시지와 세션 운영 설정
persistence true
persistence_location /mosquitto/data/
max_packet_size 8192

# 컨테이너 로그로 출력
log_dest stdout
log_type error
log_type warning
log_type notice
