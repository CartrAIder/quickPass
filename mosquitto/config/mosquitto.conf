# QuickPass Mosquitto 설정
# 인터넷 구간 TLS는 Cloudflare가 종료한다. 이 컨테이너는 Docker 내부에서만
# 일반 MQTT와 MQTT over WebSocket을 처리한다.

# Spring Boot 등 Docker 내부 서비스용 MQTT/TCP 리스너
listener 1883
protocol mqtt

# Nginx가 프록시하는 ESP32 MQTT over WebSocket 리스너
listener 9001
protocol websockets

# 익명 접속 차단 및 사용자별 인증/인가
allow_anonymous false
password_file /mosquitto/config/auth/password.txt
acl_file /mosquitto/config/acl.txt

# 메시지와 세션 운영 설정
persistence true
persistence_location /mosquitto/data/
max_packet_size 8192

# 컨테이너 로그로 출력
log_dest stdout
log_type error
log_type warning
log_type notice
