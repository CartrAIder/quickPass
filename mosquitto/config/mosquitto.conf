# QuickPass 개발용 Mosquitto 설정
# 운영 배포 전에는 allow_anonymous를 false로 바꾸고 인증(비밀번호 파일 등)을 반드시 설정할 것.

# MQTT 기본 리스너(포트 개방)
listener 1883
protocol mqtt

# WebSocket 리스너 (브라우저에서 직접 연결할 때 사용)
listener 9001
protocol websockets

# 개발 편의를 위한 익명 접속 허용
allow_anonymous true

# 메시지 영속화
persistence true
persistence_location /mosquitto/data/

# 로그를 컨테이너 표준 출력으로 (docker logs 로 확인)
log_dest stdout
