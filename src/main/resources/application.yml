spring:
  application:
    name: quickPass

  # .env 파일 내용 조회
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  servlet:
    multipart:
      max-file-size: 5MB
      # multipart 경계/헤더 오버헤드를 포함해 5MB 파일을 받을 수 있도록 요청 한도는 조금 더 크게 둔다.
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000    # 30분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

auth:
  cookie:
    # 운영을 포함한 기본 프로필에서는 HTTPS 쿠키만 허용
    secure: true
  cors:
    # 운영에서는 AUTH_CORS_ALLOWED_ORIGINS에 정확한 프론트 Origin을 쉼표로 구분해 지정한다.
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html            # Swagger UI 접속 경로
    operations-sorter: method         # HTTP 메서드 기준 정렬
    tags-sorter: alpha                # 태그(컨트롤러) 알파벳 정렬
  api-docs:
    path: /v3/api-docs                # OpenAPI 스펙(JSON) 경로

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:product-images}

mqtt:
  broker-url: ${MQTT_BROKER_URL}      # 내부 연결: tcp://host:1883, TLS: ssl://host:8883
  client-id: ${MQTT_CLIENT_ID}        # 서버의 MQTT 클라이언트 ID (연결마다 고유해야 함)
  username: ${MQTT_USERNAME}          # backend MQTT 계정
  password: ${MQTT_PASSWORD}          # backend MQTT 계정 비밀번호
  trust-store-path: ${MQTT_TRUSTSTORE_PATH:}
  trust-store-password: ${MQTT_TRUSTSTORE_PASSWORD:}
  scan-topic: quickpass/cart/+/scan   # 카트 바코드 스캔 구독 토픽 (+ = qrCode 와일드카드)
  qos: 1                              # 0=최대1회, 1=최소1회(중복가능), 2=정확히1회
  scan-deduplication-ttl: 2h          # 동일 scanId 중복 차단 유지 시간

cart:
  session:
    ttl: 2h    # 카트 점유/아이템 세션의 유휴 타임아웃 (스캔/연동 시마다 초기화)

toss-payments:
  # 클라이언트 키는 결제창을 여는 브라우저에서 사용한다. 시크릿 키는 절대 프론트에 노출하지 않는다.
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM_EMAIL:}

email-verification:
  code-ttl: 10m
  verified-ttl: 30m
  resend-cooldown: 1m

password-reset:
  code-ttl: 10m
  token-ttl: 5m
  resend-cooldown: 1m
