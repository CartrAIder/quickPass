spring:
  application:
    name: quickPass

  datasource:
    url: jdbc:mysql://localhost:3306/quickpass?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: quickpass
    password: quickpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
